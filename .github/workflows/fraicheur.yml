name: veille-fraicheur

# Veille EXTERNE du site en ligne (remplace le contrôle Grafana prévu, essai expiré) :
# scripts/veille_fraicheur.py échoue si https://solaire.sitraka.lu/data/data.json a un
# meta.date_iso de plus de 10 jours, ou si l'accueil / le simulateur (EN, FR) ne
# répondent pas 200. L'échec déclenche l'e-mail GitHub « Run failed: veille-fraicheur »
# (voir CONTEXT.md, « Workflow du lundi et alertes »). Couvre ce que le rebuild ne voit
# pas : un lundi où il n'a pas tourné, une panne de Cloudflare après déploiement.
# Lecture seule : aucun commit, aucun déploiement, aucun secret.

on:
  schedule:
    - cron: "17 7 * * *"   # tous les jours vers 07:17 UTC (minute hors de l'heure pleine, moins chargée)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: veille-fraicheur
  cancel-in-progress: true

jobs:
  veille:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # SHA de commit du tag v4.4.0 (vérifié avec gh api), comme dans rebuild.yml
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Python 3 de l'image Ubuntu 24.04 : le script n'utilise que la bibliothèque standard
      - name: Fraîcheur du relevé Leneda et pages en ligne
        run: python3 scripts/veille_fraicheur.py
