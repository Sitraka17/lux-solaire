name: rebuild-weekly

# Leneda dépose ses fichiers hebdomadaires sur data.public.lu le lundi vers
# 02:00 UTC (ex. resources/…/20260914-020016/…weekly-2026-09-14-commune.csv).
# On reconstruit le lundi à 06:00 UTC + déclenchement manuel possible.
# Le build s'arrête de lui-même (exit 1) si un garde-fou de scripts/build.py
# échoue : rien n'est alors commité.
# Le site est servi par Cloudflare Pages (solaire.sitraka.lu) : après le commit,
# on déploie un dist/ qui honore .vercelignore (notes internes jamais publiées).
# ⚠️ wrangler 3.x obligatoire pour Pages (4.x convertit en Workers assets).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install pandas requests pillow
      - run: python3 scripts/build.py
      - name: Commit si les données ont changé
        run: |
          git config user.name "lux-solaire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet -- data/data.json || git commit -am "rebuild: relevé Leneda du $(python3 -c 'import json;print(json.load(open("data/data.json"))["meta"]["date_iso"])')"
          git push
      - name: Déploiement Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf /tmp/dist && mkdir -p /tmp/dist
          args=(-a --exclude=.git --exclude=.gitignore --exclude=.vercel --exclude=.vercelignore
                --exclude=__pycache__ --exclude=.cache --exclude=node_modules --exclude=.DS_Store
                --exclude=.wrangler)
          while IFS= read -r line; do
            line="${line%%#*}"; line="${line// /}"
            [ -n "$line" ] && args+=(--exclude="$line")
          done < .vercelignore
          rsync "${args[@]}" ./ /tmp/dist/
          test -f /tmp/dist/index.html
          npx --yes wrangler@3 pages deploy /tmp/dist --project-name=lux-solaire --branch=main --commit-dirty=true
