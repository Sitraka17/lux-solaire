name: rebuild-weekly

# Leneda dépose ses fichiers hebdomadaires sur data.public.lu le lundi vers
# 02:00 UTC (ex. resources/…/20260914-020016/…weekly-2026-09-14-commune.csv).
# On reconstruit le lundi à 06:00 UTC + déclenchement manuel possible.
#
# Ordre strict, chaque étape s'arrête au premier échec (rien n'est alors commité
# ni déployé, et GitHub envoie l'e-mail d'échec : voir CONTEXT.md, « Alertes ») :
#   1. build (garde-fous de scripts/build.py, dont la fraîcheur du relevé Leneda :
#      plus de 10 jours, ou fichiers commune / not-grouped à plus de 7 jours d'écart
#      = exit 1) ;
#   2. tests (pytest + node --test) ;
#   3. dist par LISTE BLANCHE (scripts/make_dist.py, même script qu'en local) ;
#   4. commit + push si les données ont changé ;
#   5. déploiement Cloudflare Pages (solaire.sitraka.lu).
# ⚠️ wrangler 3.x obligatoire pour Pages (4.x convertit en Workers assets).
# Versions figées le 2/11/2026 sur celles du poste local (Python 3.9 en local,
# 3.12 ici : mêmes versions de paquets, arbre complet dans scripts/constraints.txt).
# Actions épinglées par SHA de commit (tag en commentaire, vérifié avec `gh api
# repos/actions/<nom>/git/matching-refs/tags/<tag>`) : un tag peut être déplacé, un SHA non.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

# Jamais deux rebuilds en parallèle (cron + déclenchement manuel) : le second
# attend la fin du premier au lieu de pousser et déployer en même temps.
concurrency:
  group: rebuild-weekly
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  WRANGLER_VERSION: "3.114.17"

jobs:
  rebuild:
    # Un déclenchement manuel sur une autre branche que main mettrait cette branche
    # en production (déploiement --branch=main) : le job ne tourne que sur main
    # (le cron tourne toujours sur la branche par défaut, main).
    if: github.ref == 'refs/heads/main'
    # image figée (et non ubuntu-latest) : la version apt de fonts-dejavu-core ci-dessous en dépend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Police DejaVu des images og (version de Ubuntu 24.04 « noble », Launchpad)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core=2.37-8
      - name: Dépendances Python (arbre complet figé, numpy compris)
        run: pip install -r scripts/requirements.txt -c scripts/constraints.txt

      - name: Build (échoue si un garde-fou saute, dont la fraîcheur Leneda)
        run: python3 scripts/build.py

      # tests/ entier : test_arrondis, test_baremes, test_build_blanc, test_croise_baremes (formules
      # Python = moteur JS sur une grille fine), test_fraicheur, test_leneda, test_make_dist, test_slug,
      # test_tailles, test_veille (workflow fraicheur.yml)
      - name: Tests Python
        run: python3 -m pytest tests/ -q
      - name: Tests du moteur du simulateur
        run: node --test tests/sim-engine.test.mjs

      - name: Dist par liste blanche
        run: python3 scripts/make_dist.py /tmp/dist

      - name: Commit si les données ont changé
        run: |
          git config user.name "lux-solaire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet -- data/data.json || git commit -am "rebuild: relevé Leneda du $(python3 -c 'import json;print(json.load(open("data/data.json"))["meta"]["date_iso"])')"
          git push

      - name: Déploiement Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Lancé depuis la racine du dépôt : wrangler y compile functions/ (compteur /e),
        # qui n'est jamais copié dans /tmp/dist.
        run: |
          case "$WRANGLER_VERSION" in 3.*) ;; *) echo "wrangler $WRANGLER_VERSION : 3.x obligatoire" >&2; exit 1;; esac
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/dist --project-name=lux-solaire --branch=main --commit-dirty=true
